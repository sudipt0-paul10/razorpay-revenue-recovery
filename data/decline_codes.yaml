# Source of truth for gate decisions. data/decline_codes.md is the human view.
# tests/test_decline_codes_sync.py asserts the two agree.
#
# PROVENANCE CONTRACT
#   doc_description  -> [CITE]  sourced from source_url
#   classification   -> PROJECT POLICY. Not prescribed by Razorpay.
#   basis            -> doc_supported | project_inference | fail_safe | project_safety_policy
#
# v4 CHANGE: reframed for Option 1 (recovery orchestration).
#   The agent CANNOT retry payments — Razorpay owns the retry schedule and does
#   not support manual charging of domestic cards. `agent_action: retry_payment`
#   has been removed everywhere. `auto_retry_resolves` replaces `retry_class`:
#   it now describes whether RAZORPAY's automatic retry is likely to fix the
#   failure, which is what tells the agent whether to wait or to act.

meta:
  version: 4
  verified_on: 2026-08-25
  framing: recovery_orchestration        # agent contacts; Razorpay retries
  sources:
    cards:          {url: "https://razorpay.com/docs/errors/payments/cards/", status: verified}
    upi:            {url: "https://razorpay.com/docs/errors/payments/upi/", status: verified}
    error_params:   {url: "https://razorpay.com/docs/errors/payments/payment-methods-error-parameters/", status: partial}
    list:           {url: "https://razorpay.com/docs/errors/payments/list/", status: not_machine_readable}
    sub_retries:    {url: "https://razorpay.com/docs/payments/subscriptions/payment-retries/", status: verified}
    sub_states:     {url: "https://razorpay.com/docs/payments/subscriptions/states/", status: verified}

# ================================================================ SUBSCRIPTIONS
subscriptions:
  retry_control:
    owner: razorpay
    provenance: CITE
    merchant_can_schedule_retries: false
    manual_charge_domestic_card_supported: false
    models:
      card:     {schedule: [T+1, T+2, T+3], then: halted}
      upi:      {schedule: [T+1, T+2, T+3], then: halted}
      emandate:
        schedule: awaits_prior_payment_resolution
        note: "Retry attempted only on confirmation/rejection of the last payment; may exceed 24h."
        bank_holiday_shift: {T_holiday: "charge T-1", T_and_T1_holiday: "charge T-3"}

  # ---- THE DECISIVE MECHANIC ----
  card_change_effect:
    provenance: CITE
    pending:
      last_invoice_auto_charged: true
      outcome: [invoice_recovered, subscription_rescued]
    halted:
      last_invoice_auto_charged: false
      invoices_still_generated: true
      manual_charge_required: true
      manual_charge_available_domestic_card: false
      outcome: [subscription_rescued]
      note: >
        The T+3 boundary is a hard cutoff. A payment-method change before halt
        recovers the invoice; after halt it rescues the subscription but the
        invoice is stranded for domestic cards.

  payment_method_change_matrix:
    provenance: CITE
    card:     {to_card: true,  to_upi: true,  to_emandate: true}
    upi:      {to_card: true,  to_upi: false, to_emandate: false}
    emandate: {to_card: true,  to_upi: false, to_emandate: false}

  documented_failure_reasons:
    provenance: CITE
    form: prose_not_enum
    values: [card_has_expired, bank_has_blocked_the_card, insufficient_balance, customer_cancelled_the_mandate]

  states:
    provenance: CITE
    values: [created, authenticated, active, pending, halted, cancelled, paused, expired, completed]
    cancelled: {terminal: true, restartable: false, agent_action: no_contact}
    expired:
      meaning: "Authentication not completed by start_at."
      warning: "NOT mandate expiry. Do not model as such."
      agent_action: no_contact

  unverified:
    may_be_emitted_by_simulator: false
    items:
      emandate_source_taxonomy_bank:       "only the CARD source enum is confirmed"
      mandate_expired:                     "not documented; 'expired' state means something else"
      debit_amount_exceeds_registered_max: "not documented"
      pre_debit_notification_failure:      "not documented"
      account_closed_or_frozen:            "not documented"
    promotion_rule: "Regulatory plausibility is not verification."

# ================================================================ DEFAULTS
defaults:
  unknown_code:
    auto_retry_resolves: unknown
    agent_action: escalate_unknown_failure
    basis: fail_safe
    rationale: >
      Do NOT assume the payment method needs changing. We do not know that, and
      prompting a customer to replace a working card on an unmapped code is wrong.
  unknown_source: {behaviour: conservative_subcase, basis: fail_safe}
  ambiguous_subcase: {behaviour: least_actionable_wins, basis: fail_safe}
  global_caps:
    max_contacts_per_episode: 3
    episode_window_days: 30
    quiet_hours_ist: {start: "09:00", end: "21:00"}
    provenance: ASSUMPTION
    note: "Self-imposed contact budget. Not a Razorpay limit. Razorpay's own failure email is not counted."

cohort_scope:
  unit: subscription_pending_episode
  v1_methods: [card]
  provenance: PROJECT_ASSUMPTION
  rationale: "eMandate/UPI retry models are verified but out of v1 scope; cards only."
  exclude_context: attended_only
  enforced_by: [tests/test_no_attended_codes.py, tests/test_v1_cards_only.py]

agent_action_vocabulary:
  - send_payment_method_change_prompt
  - send_topup_reminder
  - send_subscription_link
  - hold_service_delivery
  - escalate_to_merchant
  - escalate_unknown_failure
  - wait                                  # explicit, logged. Restraint is an action.
  - stop_episode
forbidden_actions:
  - retry_payment                         # no merchant-triggered retry exists
  enforced_by: tests/test_gate_no_retry_action.py

source_routing:
  cards:
    provenance: CITE
    values:
      issuer_bank: {routing: needs_reason,            basis: project_inference}
      gateway:     {routing: transient_default,       basis: project_inference}
      internal:    {routing: transient_default,       basis: project_inference}
      customer:    {routing: customer_action_default, basis: project_inference}
      business:    {routing: exclude_from_cohort,     provenance: PROJECT_ASSUMPTION}
  upi:
    provenance: UNVERIFIED
    values: {}
    note: "UPI tab did not render. Do not add plausible-looking enum values."

# ================================================================ CARD CODES
codes:

  - code: insufficient_funds
    method: card
    verified: true
    in_v1_cohort: true
    source_url: https://razorpay.com/docs/errors/payments/cards/
    doc_description: "The customer's bank account did not have enough funds to complete the transaction."
    classification:
      auto_retry_resolves: likely_if_funded_before_halt
      agent_action: send_topup_reminder
      urgency: before_halt
      basis: project_inference
      basis_note: >
        Razorpay's T+1/T+2/T+3 retries will succeed if the balance is restored in
        time. The agent's job is to prompt the top-up early enough to be caught by
        a remaining auto-retry. After halt this remedy is worthless.

  - code: card_expired
    method: card
    verified: true
    in_v1_cohort: true
    source_url: https://razorpay.com/docs/errors/payments/cards/
    doc_description: "The customer's card is expired."
    classification:
      auto_retry_resolves: false
      agent_action: send_payment_method_change_prompt
      urgency: immediate
      basis: doc_supported
      basis_note: "No auto-retry can fix an expired card. Only a method change. Act before halt to recover the invoice."

  - code: debit_instrument_blocked
    method: card
    verified: true
    in_v1_cohort: true
    source_url: https://razorpay.com/docs/errors/payments/cards/
    doc_description: "The card is blocked, either by the customer or their bank."
    classification:
      auto_retry_resolves: false
      agent_action: send_payment_method_change_prompt
      urgency: immediate
      basis: doc_supported

  - code: card_not_enrolled
    method: card
    verified: true
    in_v1_cohort: true
    source_url: https://razorpay.com/docs/errors/payments/cards/
    doc_description: "The card was not activated or enabled by the customer for online transactions."
    classification:
      auto_retry_resolves: false
      agent_action: send_payment_method_change_prompt
      urgency: immediate
      basis: doc_supported
    equivalent_description_to: [card_disabled_for_online_payments, debit_instrument_inactive]
    note: "Distinct code emitted separately by Razorpay. Not collapsed."

  - code: card_disabled_for_online_payments
    method: card
    verified: true
    in_v1_cohort: true
    source_url: https://razorpay.com/docs/errors/payments/cards/
    doc_description: "The card was not activated or enabled by the customer for online transactions."
    classification:
      auto_retry_resolves: false
      agent_action: send_payment_method_change_prompt
      urgency: immediate
      basis: doc_supported
    equivalent_description_to: [card_not_enrolled, debit_instrument_inactive]

  - code: debit_instrument_inactive
    method: card
    verified: true
    in_v1_cohort: true
    source_url: https://razorpay.com/docs/errors/payments/cards/
    doc_description: "The card was not activated or enabled by the customer for online transactions."
    classification:
      auto_retry_resolves: false
      agent_action: send_payment_method_change_prompt
      urgency: immediate
      basis: doc_supported
    equivalent_description_to: [card_not_enrolled, card_disabled_for_online_payments]

  - code: card_declined
    method: card
    verified: true
    in_v1_cohort: true
    source_url: https://razorpay.com/docs/errors/payments/cards/
    doc_description: "Declined by the customer's bank. Razorpay may not have access to the specific failure reason, as banks typically do not provide it."
    classification:
      auto_retry_resolves: unknown
      agent_action: send_payment_method_change_prompt
      urgency: immediate
      basis: fail_safe
    report_separately: true
    note: >
      Ambiguous bucket. The reason is often unavailable, so the fail-safe remedy
      may be wrong (a top-up reminder might have worked). We make NO claim about
      production volume. Modelled weight lives in configs/population.yaml.

  - code: payment_failed
    method: card
    verified: true
    in_v1_cohort: true
    source_url: https://razorpay.com/docs/errors/payments/cards/
    doc_description: "Declined by the customer's bank. Equivalent documented description to card_declined."
    classification:
      auto_retry_resolves: unknown
      agent_action: send_payment_method_change_prompt
      urgency: immediate
      basis: fail_safe
    report_separately: true

  - code: bank_technical_error
    method: card
    verified: true
    in_v1_cohort: true
    source_url: https://razorpay.com/docs/errors/payments/cards/
    doc_description: "There was a downtime on the customer's bank."
    classification:
      auto_retry_resolves: likely
      agent_action: wait
      urgency: none
      basis: project_inference
      basis_note: "Downtime is transient and Razorpay will retry daily. Contacting the customer here wastes a contact."

  - code: gateway_technical_error
    method: card
    verified: true
    in_v1_cohort: true
    source_url: https://razorpay.com/docs/errors/payments/cards/
    doc_description: "There was a downtime on Razorpay's partner bank."
    classification:
      auto_retry_resolves: likely
      agent_action: wait
      urgency: none
      basis: project_inference

  - code: transaction_limit_exceeded
    method: card
    verified: true
    in_v1_cohort: true
    source_url: https://razorpay.com/docs/errors/payments/cards/
    doc_description: "The customer has already reached the maximum transaction limit on their card for the day. Docs recommend a different card or alternative payment method."
    classification:
      auto_retry_resolves: likely
      agent_action: wait
      urgency: none
      basis: project_inference
      basis_note: >
        A DAILY limit resets, and Razorpay's next-day auto-retry lands after the
        reset. The v3 txn_limit_policy sweep is REMOVED: it debated retry timing,
        which is no longer ours to choose.

  - code: payment_risk_check_failed
    method: card
    verified: true
    in_v1_cohort: true
    source_url: https://razorpay.com/docs/errors/payments/cards/
    doc_description: "The customer's bank declined the payment, citing it as fraudulent. Docs recommend advising the customer to attempt payment with another card."
    classification:
      auto_retry_resolves: false
      agent_action: escalate_to_merchant
      then: stop_episode
      basis: project_safety_policy
      basis_note: >
        We deliberately do NOT follow the documented recommendation. Automated
        prompting toward alternate instruments after a fraud decline is a pattern
        we judge unacceptable in an unattended agent. Razorpay does not
        characterise it; the judgement is ours.
    reason_code: RISK_DECLINE_STOP
    hard_stop: true
    enforced_by: tests/test_gate_risk_stop.py

  # ---- attended-only: excluded ----
  - {code: payment_timed_out,     method: card, verified: true, in_v1_cohort: false, classification: {context: attended_only}, excluded_from_cohort: true}
  - {code: authentication_failed, method: card, verified: true, in_v1_cohort: false, classification: {context: attended_only}, excluded_from_cohort: true}
  - {code: incorrect_cvv,         method: card, verified: true, in_v1_cohort: false, classification: {context: attended_only}, excluded_from_cohort: true}
  - {code: payment_cancelled,     method: card, verified: true, in_v1_cohort: false, classification: {context: attended_only}, excluded_from_cohort: true}

# ---- UPI codes: verified, retained, OUT OF V1 SCOPE (cards only) ----
upi_codes_out_of_v1_scope:
  note: "Verified against the UPI error page and retained for a future scope expansion. Not emitted by the v1 simulator."
  codes: [insufficient_funds, bank_technical_error, gateway_technical_error, payment_declined,
          credit_failed, invalid_vpa, vpa_resolution_failed, payment_cancelled,
          payment_collect_request_expired, payment_timed_out]

# ================================================================ UNVERIFIED
unverified:
  policy:
    agent_action: escalate_unknown_failure
    may_be_emitted_by_simulator: false
    enforced_by: tests/test_unverified_not_emitted.py
    promotion_rule: >
      Promoted ONLY when the code appears on a Razorpay payment-error page with a
      documented description and next step, with a working anchor link.
  codes:
    - incorrect_otp
    - otp_expired
    - otp_attempts_exceeded
    - incorrect_pin
    - pin_attempts_exceeded
    - card_number_invalid
    - incorrect_card_details
    - incorrect_card_expiry_date
    - incorrect_cardholder_name
    - international_transaction_not_allowed
    - transaction_daily_limit_exceeded
    - transaction_frequency_limit_exceeded
    - upi_app_technical_error
    - authorisation_declined_by_psp
    - psp_app_not_available