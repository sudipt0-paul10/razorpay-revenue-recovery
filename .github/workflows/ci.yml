name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff
        run: ruff check .

      - name: Run tests (regression/safety gate)
        run: pytest --ignore=tests/test_stage5_falsification.py

      - name: Run Stage 5 falsification diagnostics (non-blocking, documented finding)
        continue-on-error: true
        run: |
          echo "::notice::tests/test_stage5_falsification.py::test_1_policy_ordering is a pre-registered, documented falsification result (A2-ish does not beat A1-ish on invoice recovery on dev). See CHANGELOG.md and docs/DAY8-HOLDOUT-PLAN.md. This step is diagnostic and does not gate CI."
          pytest tests/test_stage5_falsification.py -v