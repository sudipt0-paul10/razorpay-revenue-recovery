[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "razorpay-revenue-recovery"
version = "0.1.0"
description = "A simulated payment recovery agent with rigorous evaluation."
requires-python = ">=3.13"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Deliberately NOT a hard dependency. tests/test_razorpay_test_mode.py
# ::test_guard_is_offline asserts razorpay is absent from sys.modules; if the
# SDK were installed by default that assertion would weaken from "cannot be
# imported" to "happens not to be imported". CI installs [dev] only.
live = ["razorpay>=1.4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]