[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "razorpay-revenue-recovery"
version = "0.1.0"
description = "A simulated payment recovery agent with rigorous evaluation."
requires-python = ">=3.13"
dependencies = ["pyyaml>=6.0", "numpy==2.5.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Deliberately NOT a hard dependency. tests/test_razorpay_test_mode.py
# ::test_guard_is_offline asserts razorpay is absent from sys.modules; if the
# SDK were installed by default that assertion would weaken from "cannot be
# imported" to "happens not to be imported". CI installs [dev] only.
# google-genai (Day 6 Stage 6D): same rationale - src/rrx/agent/gemini_client.py
# is the only module that imports it, and only inside its complete() method,
# so the rest of the package (including every offline test) never needs it
# installed. Not the deprecated google-generativeai package (EOL 2025-11-30).
# openai (Day 6 Stage 6I): same rationale again - src/rrx/agent/openai_client.py
# is the only module that imports it, only inside its complete() method.
# Pinned to the version already verified installed for the Stage 6G.1/6I
# empirical probes (openai==3.5.0), not a loose floor - see
# tests/test_openai_client_offline.py for the offline-only mock coverage
# that exercises this SDK's actual installed API surface.
live = ["razorpay>=1.4", "google-genai>=1.0", "openai==3.5.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]